<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Xác Minh Email</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; }
        .card { background: white; border-radius: 20px; padding: 35px 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .icon { width: 70px; height: 70px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; margin: 0 auto 15px; }
        h1 { text-align: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; color: #1e293b; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 20px; font-size: 0.85rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; }
        input:focus { outline: none; border-color: #6366f1; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .error { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; text-align: center; display: none; margin-top: 10px; }
        .success-box { background: #d1fae5; color: #065f46; padding: 15px; border-radius: 10px; text-align: center; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .waiting-box { text-align: center; padding: 20px; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top: 4px solid #6366f1; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer; font-weight: 600; background: white; font-size: 0.85rem; }
        .tab-btn.active { background: #6366f1; color: white; border-color: #6366f1; }
        #adminPanel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; overflow-y: auto; }
        .admin-content { background: white; max-width: 600px; margin: 30px auto; padding: 25px; border-radius: 15px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border-radius: 8px; margin-bottom: 8px; }
        .otp-request { background: #fef3c7; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #f59e0b; }
        .admin-code-container { position: fixed; bottom: 15px; left: 15px; z-index: 999; display: flex; gap: 5px; }
        .admin-code-input { padding: 10px; border: 2px solid #e2e8f0; border-radius: 20px; width: 120px; font-size: 13px; }
        .admin-code-btn { padding: 10px 15px; background: #1e293b; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="admin-code-container">
        <input type="password" id="adminCodeInput" placeholder="🔑 Code..." class="admin-code-input">
        <button onclick="activateAdmin()" class="admin-code-btn">Admin</button>
    </div>

    <div id="adminPanel">
        <div class="admin-content">
            <div class="admin-header">
                <h2>👑 Admin Panel</h2>
                <button class="btn btn-danger" style="width:auto;padding:8px 15px;" onclick="closeAdmin()">✕</button>
            </div>
            <p style="margin-bottom:15px;">👥 Tài khoản: <strong id="totalUsers">0</strong> | 📨 Chờ: <strong id="pendingOTP">0</strong></p>
            <h3 style="margin-bottom:10px;">📨 Yêu cầu OTP:</h3>
            <div id="otpRequestsList"></div>
            <h3 style="margin:20px 0 10px;">👥 Tài khoản:</h3>
            <div id="usersList"></div>
        </div>
    </div>

    <div class="container">
        <!-- Bước 1 -->
        <div class="card step active" id="step1">
            <div class="icon">📧</div>
            <h1>Tạo Tài Khoản</h1>
            <p class="subtitle">Xác minh email để tiếp tục</p>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="setMode('register')">📝 Đăng Ký</button>
                <button class="tab-btn" onclick="setMode('forgot')">🔑 Quên MK</button>
            </div>
            
            <div id="registerForm">
                <div class="form-group">
                    <label>👤 Tên hiển thị:</label>
                    <input type="text" id="nameInput" placeholder="Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label>📧 Email:</label>
                    <input type="email" id="emailInput" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>🔒 Mật khẩu:</label>
                    <input type="password" id="passwordInput" placeholder="Ít nhất 6 ký tự">
                </div>
            </div>
            
            <div id="forgotForm" style="display:none;">
                <div class="form-group">
                    <label>📧 Email đã đăng ký:</label>
                    <input type="email" id="forgotEmailInput" placeholder="example@gmail.com">
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="requestOTP()">📨 Gửi Yêu Cầu OTP</button>
            <div class="error" id="error1"></div>
        </div>
        
        <!-- Bước 2 -->
        <div class="card step" id="step2">
            <div class="waiting-box">
                <div class="spinner"></div>
                <h1>⏳ Đang Chờ Admin</h1>
                <p class="subtitle">Admin sẽ gửi mã OTP cho bạn</p>
                <p>Email: <strong id="waitingEmail"></strong></p>
                <p style="color:#10b981;font-weight:600;margin-top:10px;">✅ Khi Admin duyệt, ô nhập OTP sẽ tự hiện!</p>
            </div>
        </div>
        
        <!-- Bước 3 -->
        <div class="card step" id="step3">
            <div class="icon">🔐</div>
            <h1>Nhập Mã OTP</h1>
            <p class="subtitle">Admin đã gửi mã OTP</p>
            <div class="form-group">
                <label>🔑 Mã OTP:</label>
                <input type="text" id="otpInput" maxlength="6" placeholder="______" style="text-align:center;font-size:22px;letter-spacing:10px;font-weight:700;">
            </div>
            <button class="btn btn-success" onclick="verifyOTP()">✅ Xác Minh</button>
            <div class="error" id="error2"></div>
        </div>
        
        <!-- Bước 4 -->
        <div class="card step" id="step4">
            <div class="icon">🎉</div>
            <h1 id="step4Title">Đăng Ký Thành Công!</h1>
            <div class="success-box">
                <div style="font-size:1.2rem;font-weight:700;" id="successName"></div>
                <div style="font-size:0.85rem;" id="successEmail"></div>
            </div>
            <button class="btn btn-primary" onclick="goToVideoCall()" style="margin-top:15px;">📞 Vào VideoCall</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD0e5Tv4Rhw6SNadrMBvymGjoAGt8h8UuM",
            authDomain: "happy-aa62c.firebaseapp.com",
            projectId: "happy-aa62c",
            storageBucket: "happy-aa62c.firebasestorage.app",
            messagingSenderId: "109570471366",
            appId: "1:109570471366:web:eba0a4147d282d466aaec7"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isAdmin = false;
        const ADMIN_CODE = 'admin@@@';
        let currentEmail = '';
        let currentName = '';
        let currentPassword = '';
        let currentOTP = '';
        let currentMode = 'register';

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'register') {
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('forgotForm').style.display = 'none';
                document.querySelector('.tab-btn:first-child').classList.add('active');
            } else {
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('forgotForm').style.display = 'block';
                document.querySelector('.tab-btn:last-child').classList.add('active');
            }
        }

        function activateAdmin() {
            const code = document.getElementById('adminCodeInput').value;
            if (code === ADMIN_CODE) {
                isAdmin = true;
                localStorage.setItem('isAdmin', 'true');
                document.getElementById('adminCodeInput').value = '';
                showAdminPanel();
            } else {
                alert('❌ Sai code!');
            }
        }

        function showAdminPanel() {
            if (!isAdmin) { alert('Không có quyền!'); return; }
            document.getElementById('adminPanel').style.display = 'block';
            loadAdminData();
        }

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        async function loadAdminData() {
            try {
                const usersSnapshot = await db.collection('users').get();
                document.getElementById('totalUsers').textContent = usersSnapshot.size;
                const usersList = document.getElementById('usersList');
                usersList.innerHTML = '';
                usersSnapshot.docs.forEach(doc => {
                    const user = doc.data();
                    const div = document.createElement('div');
                    div.className = 'user-item';
                    div.innerHTML = `
                        <div>
                            <strong>${user.name || 'N/A'}</strong>
                            <p style="font-size:0.8rem;color:#64748b;">${user.email}</p>
                        </div>
                        <button class="btn btn-danger" style="width:auto;padding:8px 12px;" onclick="deleteUser('${doc.id}')">🗑️</button>
                    `;
                    usersList.appendChild(div);
                });
                
                const otpSnapshot = await db.collection('otp_requests').where('status', '==', 'pending').get();
                document.getElementById('pendingOTP').textContent = otpSnapshot.size;
                const otpList = document.getElementById('otpRequestsList');
                otpList.innerHTML = '';
                
                if (otpSnapshot.empty) {
                    otpList.innerHTML = '<p style="color:#64748b;">Không có yêu cầu.</p>';
                }
                
                otpSnapshot.docs.forEach(doc => {
                    const req = doc.data();
                    const div = document.createElement('div');
                    div.className = 'otp-request';
                    div.innerHTML = `
                        <p><strong>📧 ${req.email}</strong></p>
                        <p>👤 ${req.name || 'N/A'}</p>
                        <p style="font-size:1.2rem;font-weight:800;color:#d97706;">🔑 OTP: ${req.otp || 'N/A'}</p>
                        <button class="btn btn-success" style="width:auto;padding:8px 12px;margin-top:8px;" onclick="approveOTP('${doc.id}')">✅ Gửi OTP</button>
                        <button class="btn btn-danger" style="width:auto;padding:8px 12px;" onclick="deleteOTP('${doc.id}')">🗑️</button>
                    `;
                    otpList.appendChild(div);
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Xóa?')) return;
            try {
                await db.collection('users').doc(userId).delete();
                // Xóa cả Firebase Auth
                const userDoc = await db.collection('users').doc(userId).get();
                const authUser = await auth.getUser(userId);
                if (authUser) await authUser.delete();
                loadAdminData();
            } catch (error) {
                alert('Lỗi: ' + error.message);
            }
        }

        async function approveOTP(requestId) {
            await db.collection('otp_requests').doc(requestId).update({ status: 'approved' });
            loadAdminData();
        }

        async function deleteOTP(requestId) {
            await db.collection('otp_requests').doc(requestId).delete();
            loadAdminData();
        }

        function requestOTP() {
            let name = '';
            let email = '';
            let password = '';
            
            if (currentMode === 'register') {
                name = document.getElementById('nameInput').value.trim();
                email = document.getElementById('emailInput').value.trim();
                password = document.getElementById('passwordInput').value;
                
                if (!name || !email || !password) {
                    showError('error1', '⚠️ Nhập đầy đủ!');
                    return;
                }
                
                if (password.length < 6) {
                    showError('error1', '⚠️ Mật khẩu ít nhất 6 ký tự!');
                    return;
                }
            } else {
                email = document.getElementById('forgotEmailInput').value.trim();
                if (!email) {
                    showError('error1', '⚠️ Nhập email!');
                    return;
                }
                name = 'Quên mật khẩu';
                password = '';
            }
            
            currentName = name;
            currentEmail = email;
            currentPassword = password;
            currentOTP = Math.floor(100000 + Math.random() * 900000).toString();
            
            db.collection('otp_requests').add({
                email: email,
                name: name,
                otp: currentOTP,
                mode: currentMode,
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then((docRef) => {
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                document.getElementById('waitingEmail').textContent = email;
                
                db.collection('otp_requests').doc(docRef.id).onSnapshot((doc) => {
                    if (doc.exists && doc.data().status === 'approved') {
                        document.getElementById('step2').classList.remove('active');
                        document.getElementById('step3').classList.add('active');
                    }
                });
            }).catch(() => {});
        }

        function verifyOTP() {
            const otpInput = document.getElementById('otpInput').value.trim();
            
            if (!otpInput) {
                showError('error2', '⚠️ Nhập mã OTP!');
                return;
            }
            
            if (otpInput === currentOTP) {
                if (currentMode === 'register') {
                    createAccount();
                } else {
                    resetPassword();
                }
            } else {
                showError('error2', '❌ Mã OTP sai!');
            }
        }

        async function createAccount() {
            try {
                // Tạo tài khoản Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(currentEmail, currentPassword);
                await userCredential.user.updateProfile({ displayName: currentName });
                
                // Lưu thêm vào Firestore
                await db.collection('users').doc(userCredential.user.uid).set({
                    name: currentName,
                    email: currentEmail,
                    friends: [],
                    friendRequests: [],
                    isOnline: true,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showSuccess(currentName, currentEmail, 'Đăng Ký Thành Công!');
                
            } catch (error) {
                let msg = 'Lỗi: ' + error.message;
                if (error.code === 'auth/email-already-in-use') msg = '❌ Email đã tồn tại!';
                showError('error2', msg);
            }
        }

        async function resetPassword() {
            try {
                const newPassword = prompt('🔒 Nhập mật khẩu mới (ít nhất 6 ký tự):');
                if (!newPassword || newPassword.length < 6) {
                    showError('error2', '⚠️ Mật khẩu ít nhất 6 ký tự!');
                    return;
                }
                
                await auth.sendPasswordResetEmail(currentEmail);
                showSuccess('Đã gửi email đặt lại mật khẩu', currentEmail, 'Kiểm Tra Email!');
                
            } catch (error) {
                let msg = 'Lỗi: ' + error.message;
                if (error.code === 'auth/user-not-found') msg = '❌ Email chưa đăng ký!';
                showError('error2', msg);
            }
        }

        function showSuccess(name, email, title) {
            document.getElementById('step3').classList.remove('active');
            document.getElementById('step4').classList.add('active');
            document.getElementById('step4Title').textContent = title;
            document.getElementById('successName').textContent = name;
            document.getElementById('successEmail').textContent = email;
        }

        function goToVideoCall() {
            window.location.href = 'https://nguyenthacphuoc.github.io/videocall/';
        }

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        if (localStorage.getItem('isAdmin') === 'true') isAdmin = true;
    </script>
</body>
</html>
